name: Auto Tag on Merge to Master

on:
  push:
    branches:
      - master

jobs:
  create-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest

    # Only run if the merge came from the uat branch
    if: |
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'Merge') &&
      (
        contains(github.event.head_commit.message, 'uat') ||
        contains(github.event.head_commit.message, 'UAT')
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec.yaml
        id: read_version
        run: |
          # Extract the version line: e.g. "version: 1.2.26+800"
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -n 1)

          # Extract full version string: 1.2.26+800
          FULL_VERSION=$(echo "$VERSION_LINE" | sed 's/version: *//')

          # Split into VERSION_NAME (before +) and VERSION_CODE (after +)
          VERSION_NAME=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$FULL_VERSION" | cut -d'+' -f2)

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

          echo "✅ VERSION_NAME: $VERSION_NAME"
          echo "✅ VERSION_CODE: $VERSION_CODE"

      - name: Generate tag name
        id: gen_tag
        run: |
          DATE=$(date +"%Y%m%d%H")
          TAG_NAME="prod_${{ steps.read_version.outputs.VERSION_NAME }}_${DATE}_${{ steps.read_version.outputs.VERSION_CODE }}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "✅ TAG_NAME: $TAG_NAME"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG_NAME="${{ steps.gen_tag.outputs.TAG_NAME }}"
          echo "Creating tag: $TAG_NAME"

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Print summary
        run: |
          echo "## 🏷️ Tag Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.gen_tag.outputs.TAG_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.read_version.outputs.VERSION_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | \`${{ steps.read_version.outputs.VERSION_CODE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY